# English Level Up Tips Workflow Update Readme And Section Md

## Action

Follow the update-readme-and-section-md workflow:
1. Edit README.md to add or update links/overview
2. Edit or create a section markdown file (e.g., listening.md, reading.md, vocabulary.md)
3. Commit both files together

## Evidence

- Workflow detected from commit patterns
- Frequency: ~6x per month
- Files: README.md, *.md (section files like listening.md, reading.md, vocabulary.md, speaking.md, understanding.md)

